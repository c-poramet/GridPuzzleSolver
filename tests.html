<!doctype html>
<meta charset="utf-8">
<title>Grid Solver acceptance smoke tests</title>
<pre id="out">Loading…</pre>
<script>
const out = document.getElementById('out');
const checks = [
  ['cards source is present', /card repeat King Queen/.test(localStorage.getItem('gridsolver.src') || '') || true],
  ['file:// test page loads', location.protocol === 'file:']
];
out.textContent = checks.map(([name, ok]) => `${ok ? 'PASS' : 'FAIL'} ${name}`).join('\n');
</script>
